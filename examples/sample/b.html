<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 B：线和密度</title>
<link rel="stylesheet" href="../../tokens/build/tokens.css">
<link rel="stylesheet" href="sample.css">
<style>
/* 不用卡片和阴影，靠分隔线和字重分层。没有色相，一屏放最多内容。 */
:root {
  color-scheme: light dark;
  --ground: #ffffff; --surface: #ffffff; --ink: #18181b; --muted: #5b5b63; --deepest: #000000;
  --line: #e4e4e7; --outline: #85858d; --hover: #f4f4f5; --focus: #18181b;
  --accent-solid: #18181b; --on-accent: #ffffff; --accent-tint: #e9e9eb; --accent-ink: #18181b;
  --danger-ink: #b3261e; --inverse-bg: #18181b; --inverse-ink: #ffffff;
  --selected-bg: #f0f0f1; --selected-cue: #18181b;

  --font-body: -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-title: var(--font-body);
  --font-group: var(--font-body);
  --text: 13px; --line-height: 18px; --text-small: 12px; --body-line: 20px; --weight-strong: 600;
  --page-title: 15px; --page-title-weight: 600; --page-title-tracking: 0;
  --group-size: 12px; --group-weight: 600; --group-ink: var(--muted);
  --row-title: 13px; --row-title-weight: 400; --row-title-line: 18px;

  --nav-width: 168px; --nav-pad: 12px 8px; --nav-gap: 0; --nav-height: 28px; --nav-bg: transparent; --nav-rule: 1px solid var(--line); --nav-rule-narrow: 1px solid var(--line); --nav-ink: var(--muted);
  --nav-current-bg: transparent; --nav-current-ink: var(--ink); --nav-current-cue: inset 2px 0 0 var(--ink);
  --main-width: 920px; --main-pad: 12px 24px; --head-gap: 10px; --group-gap: 12px; --group-title-gap: 2px; --control-height: 28px;

  --row-height: 32px; --row-pad-y: 2px; --row-pad-x: 8px; --row-gap: 0; --row-inner-gap: 16px; --row-wrap: nowrap; --title-flex: 1; --meta-max: 50%;
  --row-bg: transparent; --row-line: var(--line); --row-border-width: 0 0 1px; --row-shadow: none;
  --card-bg: var(--surface); --card-border: 1px solid var(--outline); --card-shadow: none; --page-shadow: none; --pop-shadow: 0 0 0 1px var(--outline);
  --radius-row: 0; --radius-card: 4px; --radius-page: 4px; --radius-control: 4px; --radius-check: 3px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #121214; --surface: #121214; --ink: #f2f2f3; --muted: #a1a1aa; --deepest: #ffffff;
    --line: #2c2c31; --outline: #8b8b94; --hover: #1d1d20; --focus: #f2f2f3;
    --accent-solid: #f2f2f3; --on-accent: #121214; --accent-tint: #2c2c31; --accent-ink: #f2f2f3;
    --danger-ink: #ff8a80; --inverse-bg: #f2f2f3; --inverse-ink: #121214;
    --selected-bg: #232327; --selected-cue: #f2f2f3;
  }
}
</style>
</head>
<body data-name="方向 B：线和密度">
<div id="sample"></div>
<script src="sample.js"></script>
</body>
</html>
