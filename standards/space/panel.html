<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面：靠底色分开</title>
<link rel="stylesheet" href="../../tokens/build/tokens.css">
<link rel="stylesheet" href="../typography/type.css">
<link rel="stylesheet" href="../color/color.css">
<link rel="stylesheet" href="space.css">
<link rel="stylesheet" href="../controls/controls.css">
<link rel="stylesheet" href="sample.css">
<style>
/* 每组放在一块面上，面和面之间的距离可以比留白那一版小。面是装饰，输入框的边框还是 color.control。
   控件的底色要和下面那一层分得开。面后面的底在浅色下是灰 3，面在深色下是灰 3，都和 color.fill 同色，
   所以放在那里的控件换底色：浅色下用灰 1、2、4（灰 5 上次要文字只有 4.48），深色下用灰 5、6、7。行的悬停和选中跟着换。 */
body {
  --color-fill: light-dark(var(--color-gray-1), var(--color-gray-3));
  --color-fill-hover: light-dark(var(--color-gray-2), var(--color-gray-4));
  --color-fill-active: light-dark(var(--color-gray-4), var(--color-gray-5));
  --color-selected: var(--color-fill-hover);
  --hover: var(--color-fill);
  background: var(--color-backdrop);
}

.bar {
  background: transparent;
}

.head {
  margin-block-end: var(--space-group);
}

.group {
  --color-fill: light-dark(var(--color-gray-3), var(--color-gray-5));
  --color-fill-hover: light-dark(var(--color-gray-4), var(--color-gray-6));
  --color-fill-active: light-dark(var(--color-gray-5), var(--color-gray-7));
  --color-selected: var(--color-fill-hover);
  --hover: var(--color-fill);
  padding: var(--space-item);
  border-radius: var(--radius-panel);
  background: var(--color-panel);
}

.group + .group {
  margin-block-start: var(--space-item);
}
</style>
</head>
<body>
<script src="../color/controls.js"></script>
<script src="controls.js"></script>
<script src="sample.js"></script>
</body>
</html>
